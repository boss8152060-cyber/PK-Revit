title: Rebar บันได
tooltip: >-
  ใส่เหล็กเสริมบันไดหล่อในที่ 1–2 ช่วง (Stairs Run + Landing) 4 กลุ่ม — เหล็กหลักท้องบันได,
  เหล็กต่อ/ยืดที่ชานและคาน, เหล็กลูกนอน-ลูกตั้ง, เหล็กกันร้าว/ตามขวาง — กำหนดขนาด@ระยะแต่ละกลุ่ม
  สร้าง 3D view แยกสีตามกลุ่ม ระยะหุ้ม ด่านตรวจก่อนสร้าง Ctrl+Z ครั้งเดียวย้อนทั้งชุด
author: PK Revit
