title: เลือก
tooltip: >-
  ปุ่มเดียวเลือกได้สองทาง — ถ้าเลือก host (คาน เสา ฐานราก พื้น ผนัง) อยู่ จะเลือกเหล็กทุกชนิดบน host นั้น
  (Rebar, ไวร์เมช, Area/Path); ถ้าเลือกเหล็กอยู่ จะเลือก host ของเหล็กนั้น; ถ้ายังไม่ได้เลือกอะไรจะถามว่าเอาทางไหน
  แล้วเลือกทีละตัวหรือตาม Mark; แจ้งจำนวนที่พบและที่ข้าม
author: PK Revit
