title: Rebar Collision
tooltip: >-
  ตรวจเหล็กเสริมชนกันระหว่าง host ต่างตัว (Rebar / RebarInSystem / FabricSheet)
  ขั้นแรกเทียบ bounding box (ไม่พลาดการชนจริง) ขั้นสองตรวจเฉพาะคู่ที่ผ่านด้วยเส้นศูนย์กลาง+รัศมีเหล็ก
  หรือ solid จริง ตั้งระยะห่างขั้นต่ำ (มม.) ได้ รายงานเป็นต้นไม้จัดกลุ่มตามคู่ host
  คลิกแถวเพื่อซูม/เลือกใน view ส่งออก CSV ได้
author: PK Revit
