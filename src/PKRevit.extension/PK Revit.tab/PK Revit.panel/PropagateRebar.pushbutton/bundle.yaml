title: Propagate Rebar
tooltip: >-
  คัดลอกการใส่เหล็กจาก host ต้นทาง (เสา/คาน/ฐานราก/พื้น/บันได ที่เคยใส่ด้วย PK Revit)
  ไปยัง host ชนิดเดียวกัน โดยไม่ต้องเปิดฟอร์ม — คำนวณใหม่จากขนาดของแต่ละตัวเอง
  ถ้าต้นทางไม่เคยใส่ด้วย PK Revit จะส่งต่อให้ Propagate Rebar ของ Revit
  Ctrl+Z ครั้งเดียวย้อนทั้งชุด
author: PK Revit
