title: Rebar พื้น
tooltip: >-
  ใส่เหล็กเสริมพื้น (Floor) ที่เลือกได้หลายผืน — สลับโหมด "เหล็กเส้น" (ชั้นบน/ล่าง ทิศ X/Y
  ขนาด @ระยะ) หรือ "ไวร์เมช" (Fabric Sheet) รองรับพื้นหลายรูปทรง (สี่เหลี่ยม ตัว L คางหมู)
  และช่องเปิด มีเหล็กเสริมริม/หนวดกุ้งเป็นตัวเลือก ใส่ให้พื้นชื่อ type เดียวกันทั้งอาคารได้
  Ctrl+Z ครั้งเดียวย้อนทั้งชุด
author: PK Revit
