title: Select Rebar
tooltip: >-
  เลือก host (คาน เสา ฐานราก พื้น ผนัง ฯลฯ) แล้วเลือกเหล็กทุกชนิดที่อยู่บน host นั้นใน Revit —
  Rebar, ไวร์เมช (Fabric Sheet) และเหล็กจาก Area/Path Reinforcement ไม่ว่าใครเป็นคนสร้าง
  ถ้ามีของที่เลือกอยู่แล้วจะใช้เลย ไม่ก็เลือกทีละตัวหรือเลือกตาม Mark; แจ้งจำนวนแยกตามชนิด
author: PK Revit
