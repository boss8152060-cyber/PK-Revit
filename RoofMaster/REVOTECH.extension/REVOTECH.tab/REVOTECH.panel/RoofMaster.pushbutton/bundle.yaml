title: Roof Master
tooltip: >-
  ปุ่มเดียวสร้างโครงหลังคาทั้งชุด — เด้งฟอร์มกรอกระยะ (แป/จันทัน/เชิงชาย/
  สัน/ตะเข้ราง/รางน้ำ) แล้วรันไล่ตามลำดับที่พิสูจน์แล้ว:
  ตะเข้สัน+อกไก่ → แป → รางน้ำ+ตะเข้ราง → จันทัน
  (เรียกสคริปต์ปุ่มลูกตัวจริง ค่าที่จูนไว้ในปุ่มลูกยังใช้ร่วมกัน)
  เลือก Roof ก่อนกด = ทำเฉพาะหลังที่เลือก — ขั้นไหนล้มหยุดตรงนั้น
  ของที่ทำแล้วยังอยู่ — ย้อนทั้งชุดได้ด้วย Ctrl+Z ครั้งเดียว
author: REVOTECH
